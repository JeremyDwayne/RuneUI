name: Bug report
description: Something in RuneUI looks wrong or doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Attack a target with Necromancy
        2. Hover a debuff icon
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RuneUI version
      description: The version in plugin.json, or the commit you are running.
  - type: textarea
    id: console
    attributes:
      label: Console lines
      description: Any lines starting with RuneUI from the game console (Alt and the key under Esc).
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps show the problem.
